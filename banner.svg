<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Yukta Vyas, Full Stack Developer: Java, Spring Boot, Angular">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="0.6" stop-color="#EEF0E2"/>
      <stop offset="1" stop-color="#E1EAD8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F6B4A"/>
      <stop offset="1" stop-color="#A9824F"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A3B899" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A3B899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D9C3A0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D9C3A0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3F6B4A" fill-opacity="0.08"/>
    </pattern>
    <style>
      .hello { font: 500 18px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7A8F6E; letter-spacing: 3px; }
      .name  { font: 800 66px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #24402F; }
      .role  { font: 700 25px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); }
      .tag   { font: 400 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #5E6B57; }
      .chip  { font: 600 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #2F4A36; }
      .node  { font: 700 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #24402F; text-anchor: middle; }
      .sub   { font: 500 9.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7A6A4F; text-anchor: middle; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#dots)"/>
  <circle cx="160" cy="40" r="220" fill="url(#glowPink)"/>
  <circle cx="960" cy="300" r="260" fill="url(#glowIndigo)"/>


  <!-- leaves -->
  <g opacity="0.55">
    <path d="M1120 20 C1160 30 1180 70 1170 110 C1130 100 1110 60 1120 20 Z" fill="#9DB591"/>
    <path d="M1120 20 C1140 55 1155 80 1170 110" stroke="#6E8F63" stroke-width="1.5" fill="none"/>
    <g transform="translate(-22,38) scale(0.8)"><path d="M30 300 C20 270 40 240 75 235 C80 265 60 295 30 300 Z" fill="#C9B48E"/>
    <path d="M30 300 C45 280 60 258 75 235" stroke="#A9824F" stroke-width="1.5" fill="none"/></g>
    <path d="M700 330 C705 305 725 290 750 292 C748 318 728 332 700 330 Z" fill="#9DB591"/>
  </g>

  <!-- left: identity -->
  <text x="64" y="92" class="hello">HI, I'M</text>
  <text x="62" y="160" class="name">Yukta Vyas</text>
  <text x="64" y="202" class="role">Full Stack Developer · Java · Spring Boot · Angular</text>
  <text x="64" y="234" class="tag">I build secure enterprise apps, from REST APIs and microservices to fast Angular UIs.</text>

  <!-- chips -->
  <g transform="translate(64,262)">
    <rect width="96" height="30" rx="15" fill="#5B8C5A" fill-opacity="0.18" stroke="#5B8C5A" stroke-opacity="0.6"/>
    <text x="48" y="20" class="chip" text-anchor="middle">Spring Boot</text>
    <rect x="106" width="80" height="30" rx="15" fill="#A9824F" fill-opacity="0.18" stroke="#A9824F" stroke-opacity="0.6"/>
    <text x="146" y="20" class="chip" text-anchor="middle">Angular</text>
    <rect x="196" width="116" height="30" rx="15" fill="#7FA37A" fill-opacity="0.18" stroke="#7FA37A" stroke-opacity="0.6"/>
    <text x="254" y="20" class="chip" text-anchor="middle">Microservices</text>
    <rect x="322" width="100" height="30" rx="15" fill="#5B8C5A" fill-opacity="0.18" stroke="#5B8C5A" stroke-opacity="0.6"/>
    <text x="372" y="20" class="chip" text-anchor="middle">BCM · GRC</text>
    <rect x="432" width="76" height="30" rx="15" fill="#A9824F" fill-opacity="0.18" stroke="#A9824F" stroke-opacity="0.6"/>
    <text x="470" y="20" class="chip" text-anchor="middle">Gen AI</text>
  </g>

  <!-- right: animated microservices map -->
  <g transform="translate(790,40)" fill="none">
    <!-- links -->
    <g stroke="#7FA37A" stroke-opacity="0.6" stroke-width="2">
      <path id="l1" d="M70 130 L190 50"/>
      <path id="l2" d="M70 130 L190 130"/>
      <path id="l3" d="M70 130 L190 210"/>
      <path id="l4" d="M190 50 L320 130"/>
      <path id="l5" d="M190 130 L320 130"/>
      <path id="l6" d="M190 210 L320 130"/>
    </g>
    <!-- moving request pulses -->
    <g fill="#5B8C5A">
      <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
    </g>
    <g fill="#A9824F">
      <circle r="3.5"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#l4"/></animateMotion></circle>
      <circle r="3.5"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>
      <circle r="3.5"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#l6"/></animateMotion></circle>
    </g>

    <!-- nodes -->
    <g>
      <circle cx="70" cy="130" r="40" fill="#FBF8F1" stroke="url(#accent)" stroke-width="2.5"/>
      <text x="70" y="128" class="node">Angular</text>
      <text x="70" y="143" class="sub">UI</text>

      <circle cx="190" cy="50" r="35" fill="#FBF8F1" stroke="#5B8C5A" stroke-width="2"/>
      <text x="190" y="48" class="node">Gateway</text>
      <text x="190" y="62" class="sub">Spring Cloud</text>

      <circle cx="190" cy="130" r="35" fill="#FBF8F1" stroke="#7FA37A" stroke-width="2"/>
      <text x="190" y="128" class="node">REST API</text>
      <text x="190" y="142" class="sub">Spring Boot</text>

      <circle cx="190" cy="210" r="35" fill="#FBF8F1" stroke="#A9824F" stroke-width="2"/>
      <text x="190" y="208" class="node">Security</text>
      <text x="190" y="222" class="sub">JWT · OAuth2</text>

      <circle cx="320" cy="130" r="38" fill="#FBF8F1" stroke="url(#accent)" stroke-width="2.5"/>
      <text x="320" y="128" class="node">Database</text>
      <text x="320" y="142" class="sub">MySQL · PG</text>

      <!-- breathing halo on the UI node -->
      <circle cx="70" cy="130" r="40" stroke="#5B8C5A" stroke-opacity="0.5">
        <animate attributeName="r" values="40;54;40" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
